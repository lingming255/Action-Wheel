<div id="aw-unified-glass" aria-label="Action Wheel 一体磨砂圆环 / Unified frosted wheel">
  <style>
    #aw-unified-glass { color-scheme: light dark; width: 100%; font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif; color: light-dark(#192e39, #e7eef2); --aw-accent: light-dark(#277572, #a1d6ce); --aw-ink: light-dark(#173139, #e9f2f3); --aw-muted: light-dark(#526875, #a6bac3); --aw-edge: light-dark(#ffffffa3, #deefff45); --aw-opacity: .46; --aw-blur: 18px; --aw-edge-strength: .46; }
    #aw-unified-glass * { box-sizing: border-box; }
    #aw-unified-glass button, #aw-unified-glass input { font: inherit; }
    #aw-unified-glass .aw-product { background: light-dark(#e8eff2, #111a20); border-radius: 20px; overflow: hidden; }
    #aw-unified-glass .aw-header { padding: 20px 22px 12px; }
    #aw-unified-glass .aw-brand { color: var(--aw-muted); letter-spacing: 2px; font-size: 11px; }
    #aw-unified-glass .aw-title { font-size: 20px; font-weight: 500; margin-top: 4px; }
    #aw-unified-glass .aw-title span { font-size: 13px; color: var(--aw-muted); font-weight: 400; margin-left: 8px; }
    #aw-unified-glass .aw-stage { height: 392px; position: relative; overflow: hidden; isolation: isolate; touch-action: none; user-select: none; background: light-dark(#c7d4da, #1b2a34); }
    #aw-unified-glass .aw-scene { position: absolute; inset: 0; overflow: hidden; pointer-events: none; background: radial-gradient(ellipse at 72% 15%, light-dark(#d9dbb8, #3a524f), transparent 58%), radial-gradient(ellipse at 15% 84%, light-dark(#86adb5, #284653), transparent 65%); }
    #aw-unified-glass .aw-hill { position: absolute; width: 110%; height: 250px; left: 16%; bottom: -155px; border-radius: 48%; transform: rotate(-15deg); background: linear-gradient(25deg, light-dark(#64959c, #1d3a43), light-dark(#b3c8bf, #45615c)); }
    #aw-unified-glass .aw-hill::after { content: ""; position: absolute; inset: -40px 18% 50px -55%; background: light-dark(#a5bec8, #2a3d4d); border-radius: 48%; transform: rotate(20deg); }
    #aw-unified-glass .aw-window { position: absolute; top: 35px; left: calc(50% - 220px); width: 238px; height: 150px; transform: rotate(-5deg); background: light-dark(#f3f6f99c, #121d2b7a); border: 1px solid light-dark(#ffffff88, #ddeeff19); border-radius: 10px; box-shadow: 0 14px 35px #07111c14; }
    #aw-unified-glass .aw-window-bar { height: 26px; border-bottom: 1px solid light-dark(#8da5b330, #e1eaff0d); display: flex; align-items: center; padding: 0 10px; gap: 4px; }
    #aw-unified-glass .aw-window-bar i { width: 4px; height: 4px; border-radius: 50%; background: var(--aw-muted); opacity: .4; }
    #aw-unified-glass .aw-lines { padding: 16px; }
    #aw-unified-glass .aw-lines i { display: block; width: 76%; height: 4px; margin-bottom: 11px; background: var(--aw-muted); opacity: .24; border-radius: 2px; }
    #aw-unified-glass .aw-lines i:nth-child(2) { width: 48%; }
    #aw-unified-glass .aw-lines i:nth-child(3) { width: 89%; }
    #aw-unified-glass .aw-wheel { position: absolute; width: 316px; height: 316px; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    #aw-unified-glass .aw-wheel[data-closed="true"] { display: none; }
    #aw-unified-glass .aw-body { position: absolute; inset: 0; }
    #aw-unified-glass .aw-glass-sheet { position: absolute; inset: 8px; border-radius: 50%; background: linear-gradient(145deg, light-dark(rgb(244 250 253 / var(--aw-opacity)), rgb(57 75 88 / var(--aw-opacity))), light-dark(rgb(225 236 241 / var(--aw-opacity)), rgb(17 28 38 / var(--aw-opacity)))); backdrop-filter: blur(var(--aw-blur)) saturate(1.1); -webkit-backdrop-filter: blur(var(--aw-blur)) saturate(1.1); box-shadow: 0 12px 28px #07111b24, inset 0 1px 0 light-dark(#ffffff80, #effaff10); pointer-events: none; }
    #aw-unified-glass .aw-guides { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: var(--aw-edge); stroke-width: .7; pointer-events: none; }
    #aw-unified-glass .aw-guides .aw-divider { opacity: .72; }
    #aw-unified-glass .aw-piece { position: absolute; inset: 0; pointer-events: none; }
    #aw-unified-glass .aw-sector { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; background: transparent; color: var(--aw-ink); pointer-events: auto; -webkit-tap-highlight-color: transparent; }
    #aw-unified-glass .aw-tint { position: absolute; inset: 0; background: linear-gradient(145deg, light-dark(#efffffb8, #9fcfc84d), light-dark(#8abbb533, #8fcac514)); opacity: calc(var(--aw-weight, 0) * var(--aw-edge-strength)); transition: opacity var(--aw-select-time, 90ms) ease-out; }
    #aw-unified-glass .aw-sector:focus-visible .aw-tint { opacity: .65; }
    #aw-unified-glass .aw-icon { position: absolute; width: 46px; height: 46px; display: grid; place-items: center; transform: translate(-50%, -50%); color: var(--aw-ink); opacity: calc(.73 + var(--aw-weight, 0) * .27); }
    #aw-unified-glass .aw-icon svg { width: 21px; height: 21px; stroke-width: 1.55; }
    #aw-unified-glass .aw-center-piece { z-index: 3; position: absolute; width: 130px; height: 130px; left: calc(50% - 65px); top: calc(50% - 65px); }
    #aw-unified-glass .aw-center { width: 130px; height: 130px; border-radius: 50%; border: 0; padding: 12px 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: transparent; color: var(--aw-ink); }
    #aw-unified-glass .aw-center svg { width: 17px; height: 17px; stroke-width: 1.5; margin-bottom: 4px; color: var(--aw-accent); }
    #aw-unified-glass .aw-name { font-size: 15px; font-weight: 500; line-height: 21px; }
    #aw-unified-glass .aw-en { font-size: 11px; line-height: 16px; color: var(--aw-muted); }
    #aw-unified-glass .aw-key { font-size: 11px; line-height: 16px; color: var(--aw-muted); }
    #aw-unified-glass .aw-indicator { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: var(--aw-accent); stroke-width: 1.7; stroke-linecap: round; opacity: 0; pointer-events: none; transition: transform var(--aw-select-time, 90ms) ease-out, opacity 90ms; }
    #aw-unified-glass .aw-wheel[data-selected]:not([data-selected="0"]) .aw-indicator { opacity: .85; }
    #aw-unified-glass .aw-pulse { position: absolute; width: 104px; height: 104px; left: calc(50% - 52px); top: calc(50% - 52px); border: 1px solid var(--aw-accent); border-radius: 50%; opacity: 0; pointer-events: none; }
    #aw-unified-glass .aw-hint { position: absolute; bottom: 13px; left: 16px; right: 16px; text-align: center; color: var(--aw-muted); font-size: 11px; pointer-events: none; }
    #aw-unified-glass .aw-controls { padding: 17px 20px 0; display: flex; align-items: center; flex-wrap: wrap; gap: 14px 18px; }
    #aw-unified-glass .aw-speed { flex: 1 1 190px; min-width: 150px; }
    #aw-unified-glass .aw-control-label { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--aw-muted); }
    #aw-unified-glass output { color: var(--aw-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
    #aw-unified-glass input[type="range"] { width: 100%; accent-color: var(--aw-accent); margin: 7px 0 0; }
    #aw-unified-glass input[type="checkbox"] { accent-color: var(--aw-accent); margin: 0; width: 15px; height: 15px; }
    #aw-unified-glass .aw-toggle { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 12px; }
    #aw-unified-glass .aw-control-button { padding: 8px 12px; border: 1px solid light-dark(#8097a34d, #b0c8d32b); background: light-dark(#ffffff60, #d2e8f309); border-radius: 9px; color: var(--aw-ink); white-space: nowrap; font-size: 12px; }
    #aw-unified-glass .aw-control-button:hover { background: light-dark(#ffffffaa, #d2e8f315); }
    #aw-unified-glass .aw-audio-row { padding: 14px 20px 0; display: flex; align-items: center; flex-wrap: wrap; gap: 12px 18px; }
    #aw-unified-glass .aw-audition { flex: 1 1 320px; }
    #aw-unified-glass summary { color: var(--aw-muted); font-size: 12px; width: fit-content; padding: 4px 0; }
    #aw-unified-glass .aw-samples { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 9px; }
    #aw-unified-glass .aw-volume { display: flex; align-items: center; gap: 8px; color: var(--aw-muted); font-size: 12px; padding-top: 8px; }
    #aw-unified-glass .aw-volume input { width: 110px; margin: 0; }
    #aw-unified-glass .aw-status { color: var(--aw-muted); font-size: 12px; min-height: 42px; padding: 13px 20px 17px; }
    #aw-unified-glass .aw-status strong { font-weight: 500; color: var(--aw-ink); }
    @media (max-width: 440px) { #aw-unified-glass .aw-header { padding: 17px 17px 12px; } #aw-unified-glass .aw-title span { display: block; margin-left: 0; margin-top: 1px; } #aw-unified-glass .aw-controls, #aw-unified-glass .aw-audio-row { padding-left: 16px; padding-right: 16px; } #aw-unified-glass .aw-stage { height: 376px; } #aw-unified-glass .aw-speed { flex-basis: 100%; } }
    @media (pointer: coarse) { #aw-unified-glass .aw-control-button, #aw-unified-glass .aw-toggle, #aw-unified-glass summary { min-height: 44px; } #aw-unified-glass input[type="range"] { min-height: 26px; } }
    @media (prefers-reduced-motion: reduce) { #aw-unified-glass .aw-sector, #aw-unified-glass .aw-tint, #aw-unified-glass .aw-lit-edge, #aw-unified-glass .aw-indicator { transition-duration: 0ms !important; } }
  </style>
  <section class="aw-product" aria-label="一体磨砂圆环演示 / Unified frosted wheel demo">
    <header class="aw-header"><div class="aw-brand">ACTION WHEEL</div><div class="aw-title">一体磨砂<span>Unified frosted glass</span></div></header>

      <div class="aw-scene" aria-hidden="true"><div class="aw-window"><div class="aw-window-bar"><i></i><i></i><i></i></div><div class="aw-lines"><i></i><i></i><i></i></div></div><div class="aw-hill"></div></div>
      <div class="aw-wheel" data-selected="0" data-closed="false"><div class="aw-body">
        <div class="aw-glass-sheet" aria-hidden="true"></div>
        <svg class="aw-guides" aria-hidden="true"><circle class="aw-outer"></circle><circle class="aw-inner"></circle><g class="aw-divider"></g></svg>
        <svg class="aw-indicator" aria-hidden="true"><path></path></svg>
        <div class="aw-pulse" aria-hidden="true"></div>
        <div class="aw-center-piece"><button class="aw-center cursor-interaction" type="button" aria-label="刷新 / Refresh"><i data-lucide="rotate-cw" aria-hidden="true"></i><span class="aw-name">刷新</span><span class="aw-en">Refresh</span><span class="aw-key">松手 / Release</span></button></div>
      </div></div>
      <div class="aw-hint">按住空白处拖选 / Hold & drag · Esc 取消 / Cancel</div>
    </div>
    <div class="aw-controls">

      <label class="aw-toggle cursor-interaction"><input class="aw-slow" type="checkbox" checked>慢放 / Slow ×4</label>
      <button type="button" class="aw-control-button aw-replay cursor-interaction">展开 / Replay</button>
    </div>
    <div class="aw-audio-row">
      <label class="aw-toggle cursor-interaction"><input class="aw-sound" type="checkbox">音效 / Sound</label>
      <details class="aw-audition"><summary class="cursor-interaction">试听音效 / Audition</summary><div class="aw-samples"><button type="button" class="aw-control-button cursor-interaction" data-sound="open">展开 / Open</button><button type="button" class="aw-control-button cursor-interaction" data-sound="switch">切换 / Switch</button><button type="button" class="aw-control-button cursor-interaction" data-sound="confirm">确认 / Confirm</button><button type="button" class="aw-control-button cursor-interaction" data-sound="cancel">取消 / Cancel</button></div><label class="aw-volume">音量 / Volume <input class="aw-volume-range" type="range" min="0" max="100" step="5" value="45" aria-label="音量 / Volume"><output class="aw-volume-value">45%</output></label></details>
    </div>
    <div class="aw-status" role="status" aria-live="polite"><strong>预览就绪</strong> / Ready</div>
  </section>
